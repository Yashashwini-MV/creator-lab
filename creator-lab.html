<style>
:root{--bg:#FBF3E6;--ink:#2B2522;--mut:#7A6A60;--pri:#B8325A;--acc:#F4D35E;--ok:#5E8B4A;--warn:#E4694F;--line:#E6D8C3;--soft:#F3E4CC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:inherit}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Instrument Sans',sans-serif;transition:background .5s}
h1,h2,h3{font-family:'Young Serif',serif;font-weight:400;line-height:1.1;margin:0}h1{font-size:clamp(2.4rem,7vw,4.6rem)}h2{font-size:clamp(1.6rem,4vw,2.4rem)}h3{font-size:1.25rem}
p{margin:.4rem 0}.mut{color:var(--mut)}.small{font-size:.85rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;padding:.7rem 1.2rem;border-radius:4px;cursor:pointer;transition:transform .15s,opacity .2s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn.sm{padding:.4rem .8rem;font-size:.85rem}
input,select,textarea{width:100%;padding:.65rem .8rem;border:1.5px solid var(--line);background:#fff;border-radius:4px;margin:.25rem 0 .8rem}
label{font-size:.85rem;color:var(--mut)}
.wrap{max-width:1080px;margin:0 auto;padding:1.2rem}
nav.top{display:flex;gap:.2rem;overflow-x:auto;border-bottom:1.5px solid var(--ink);padding:.6rem 1.2rem;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;align-items:center}
nav.top b{font-family:'Young Serif';margin-right:1rem;color:var(--pri);white-space:nowrap}
nav.top a{padding:.35rem .8rem;color:var(--ink);text-decoration:none;white-space:nowrap;border-radius:99px;font-size:.95rem}nav.top a.on{background:var(--ink);color:var(--bg)}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:2rem;align-items:center;min-height:80vh}
.collage{position:relative;height:380px}.collage div{position:absolute;border-radius:6px;padding:1rem;font-family:'Young Serif';box-shadow:6px 6px 0 var(--ink);border:1.5px solid var(--ink)}

.col{padding-top:.8rem}.col li{margin:.5rem 0}ul{padding-left:1.1rem}
.thumb{aspect-ratio:9/12;border-radius:6px;display:flex;align-items:flex-end;padding:.8rem;font-family:'Young Serif';color:#fff;font-size:1.05rem;border:1.5px solid var(--ink)}
.strip{display:flex;gap:1rem;overflow-x:auto;padding:.4rem .2rem 1rem}.strip>*{min-width:200px;flex:0 0 200px}
.row{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;border-bottom:1px solid var(--line);padding:.7rem 0;flex-wrap:wrap}
.tag{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.78rem;background:var(--soft)}.tag.g{background:#D7E8C8}.tag.y{background:var(--acc)}.tag.r{background:#F7D0C6}
.big{font-family:'Young Serif';font-size:2.2rem;color:var(--pri)}
.paper{background:#fff;border:1.5px solid var(--ink);padding:1.4rem;border-radius:4px}.hl{background:var(--soft);padding:1rem 1.2rem;border-left:5px solid var(--pri)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width 1s}
.modal{position:fixed;inset:0;background:#2b252299;display:grid;place-items:center;z-index:20;padding:1rem;animation:f .2s}.modal>div{background:var(--bg);max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:1.5rem;border-radius:6px;border:1.5px solid var(--ink);animation:u .25s}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(14px);opacity:0}}
.toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:4px;z-index:30;animation:u .25s}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.chip{padding:.5rem 1rem;border:1.5px solid var(--ink);background:none;border-radius:99px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.step{display:flex;gap:.8rem;padding:.3rem 0;color:var(--mut)}.step.done{color:var(--ink)}
.tl{display:flex;gap:.3rem;flex-wrap:wrap}.tl span{padding:.2rem .7rem;font-size:.8rem;background:var(--line);border-radius:3px}.tl span.on{background:var(--ok);color:#fff}
@media(max-width:760px){.hero,.split,.three{grid-template-columns:1fr}.collage{height:300px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.three>.col{animation:u .5s both}.three>.col:nth-child(2){animation-delay:.25s}.three>.col:nth-child(3){animation-delay:.5s}
.onb{max-width:780px;margin:0 auto;padding:2.2rem 1.2rem 5rem;min-height:90vh}
.onb .brand{font-family:'Young Serif';color:var(--pri);font-size:1.05rem;margin:0}
.onb .lab{display:block;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:1.7rem 0 .5rem}
.onb h1{margin:.2rem 0 .7rem}
.onb .lede{font-size:1.12rem;color:var(--mut);max-width:34rem;margin-bottom:2rem}
.sp3{display:grid;gap:1.1rem}
.spcard{position:relative;display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:6px;padding:1.25rem 1.35rem 1.15rem 1.55rem;cursor:pointer;transition:transform .18s,box-shadow .18s;animation:u .5s both}
.spcard:nth-child(2){animation-delay:.1s}.spcard:nth-child(3){animation-delay:.2s}
.spcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--pri);border-radius:6px 0 0 6px}
.spcard.b::before{background:var(--acc)}.spcard.s::before{background:var(--ok)}.spcard.e::before{background:var(--warn)}
.spcard:hover{transform:translate(-2px,-3px);box-shadow:5px 6px 0 var(--ink)}
.spcard:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--ink)}
.spcard .num{font-family:'Young Serif';font-size:.9rem;color:var(--mut);letter-spacing:.1em}
.spcard h3{margin:.3rem 0 .35rem}
.spcard p{color:var(--mut);margin:0 0 .7rem;max-width:34rem}
.spcard .go{font-size:.9rem;font-weight:600;color:var(--pri)}
.qlist{display:grid;gap:.6rem;margin:1.6rem 0 1.3rem}
.qopt{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:.9rem 1.05rem;cursor:pointer;transition:transform .15s,border-color .15s;animation:u .45s both}
.qopt:nth-child(2){animation-delay:.05s}.qopt:nth-child(3){animation-delay:.1s}.qopt:nth-child(4){animation-delay:.15s}.qopt:nth-child(5){animation-delay:.2s}
.qopt:hover{border-color:var(--ink);transform:translateX(4px)}
.qopt.on{border-color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}
.qopt .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut);flex:0 0 auto}
.qopt.on .dot{background:var(--pri);border-color:var(--pri)}
.pickbar{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.simlist{list-style:none;padding:0;margin:1.5rem 0}
.simlist li{display:flex;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line);color:var(--mut);animation:u .4s both}
.simlist li.done{color:var(--ink)}
.simlist .mk{width:1.3rem;color:var(--ok);font-weight:700}
.pchip{display:inline-block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:99px;padding:.2rem .7rem;background:var(--acc)}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1.1rem 1.5rem;margin:1.4rem 0}
.selrow p{font-family:'Young Serif';font-size:1.25rem;margin:.15rem 0}
.evid{display:grid;gap:.9rem;margin:1.5rem 0}
.evid .box{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:.9rem 1.05rem}
.evid .box b{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:.25rem}
.evid .obs{border-top:5px solid var(--ok)}.evid .lik{border-top:5px solid var(--acc)}.evid .unk{border-top:5px solid var(--warn)}.evid .nxt{border-top:5px solid var(--pri)}
.flab{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:.2rem}
.rev{animation:u .55s both}
@keyframes febar{0%{width:6%}55%{width:64%}100%{width:86%}}
.febar i{animation:febar 7s ease-out forwards}
.idea{padding:1.5rem 0 1.7rem;border-top:1.5px solid var(--ink)}
.idea.alt{margin-left:clamp(0px,5vw,4.5rem)}
.idea h3{font-size:clamp(1.35rem,3vw,2.1rem);margin:.55rem 0 .25rem}
.idea .hook{font-family:'Young Serif';color:var(--pri);margin:.15rem 0 .9rem}
.idea-top{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.idea .evid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.evid .ang{border-top:5px solid var(--pri)}.evid .nov{border-top:5px solid var(--line)}
.studio .ideaint{background:var(--soft);border-left:5px solid var(--acc);padding:1rem 1.2rem;margin:1.5rem 0;max-width:46rem}
.studio .idea-note{border-left-color:var(--ink)}
@media(max-width:760px){.idea.alt{margin-left:0}}</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const K='creatorlab_v1',TH=['rose','sun','garden','terracotta','cherry'],COL=['#B8325A','#5E8B4A','#E4694F','#8A5A2B'];
let supa=null;
let authReady=false;

async function initSupabase(){
  try{
    const r=await fetch('/api/config');
    const cfg=await r.json();

    if(!cfg.supabaseUrl||!cfg.supabasePublishableKey){
      console.error('Supabase configuration is missing.');
      exitUser();
      authReady=true;
      render();
      return;
    }

    supa=window.supabase.createClient(
      cfg.supabaseUrl,
      cfg.supabasePublishableKey
    );

    supa.auth.onAuthStateChange((event,session)=>{
      const u=session&&session.user;
      if(u){
        ensureUser(u).then(()=>{if(authReady)render()});
      }else{
        exitUser();
        if(authReady)render();
      }
    });

    const {data:{session}}=await supa.auth.getSession();

    if(session&&session.user){
      await ensureUser(session.user);
    }else{
      exitUser();
    }

    authReady=true;
    render();
  }catch(err){
    console.error('Supabase initialization failed:',err);
    exitUser();
    authReady=true;
    render();
  }
}

async function loadExperiments(){
  if(!supa||!S.me)return;
  try{
    const {data,error}=await supa.from('experiments').select('*').eq('user_id',S.me).order('created_at',{ascending:false});
    if(error){console.error('Experiments load failed:',error);return}
    if(!Array.isArray(data)||!data.length)return;
    const real=data.map(r=>({id:r.id,title:r.title,topic:r.topic,sub:r.subtopic,aud:r.audience,format:r.format,hook:r.hook,hyp:r.hypothesis,variable:r.variable,goal:r.goal,views:r.views,likes:r.likes,comments:r.comments,saves:r.saves,shares:r.shares,gained:r.followers_gained,date:r.date,status:r.status,an:r.ai_analysis}));
    const proto=S.exps.filter(e=>e&&e.src==='proto');
    S.exps=proto.concat(real);
    render();
  }catch(err){console.error('Experiments load failed:',err)}
}

async function saveNewExperiment(e){
  if(!supa||!S.me){toast('Experiment saved. Your next learning loop starts here.');return}
  try{
    const {data,error}=await supa.from('experiments').insert({user_id:S.me,title:e.title,topic:e.topic,subtopic:e.sub,audience:e.aud,format:e.format,hook:e.hook,hypothesis:e.hyp,variable:e.variable,goal:e.goal,views:e.views,likes:e.likes,comments:e.comments,saves:e.saves,shares:e.shares,followers_gained:e.gained,date:e.date,status:e.status,ai_analysis:e.an}).select().single();
    if(error)throw error;
    if(data&&data.id)e.id=data.id;
    save();
    toast('Experiment saved. Your next learning loop starts here.');
  }catch(err){console.error('Experiment save failed:',err);toast('We couldn\'t save this experiment. Please try again.')}
}

async function saveExperimentResults(e){
  const localOnly=!e||!Number.isSafeInteger(e.id)||e.id<1||e.id>=1e12;
  if(!supa||!S.me||localOnly){toast('Results saved.');return}
  try{
    const {error}=await supa.from('experiments').update({views:e.views,likes:e.likes,comments:e.comments,saves:e.saves,shares:e.shares,followers_gained:e.gained,status:e.status,updated_at:new Date().toISOString()}).eq('id',e.id).eq('user_id',S.me);
    if(error)throw error;
    toast('Results saved.');
  }catch(err){console.error('Experiment results save failed:',err);toast('We couldn\'t save these results. Please try again.')}
}

async function saveExperimentAnalysis(e){
  const localOnly=!e||!Number.isSafeInteger(e.id)||e.id<1||e.id>=1e12;
  if(!supa||!S.me||localOnly)return;
  try{
    const {error}=await supa.from('experiments').update({ai_analysis:e.an,updated_at:new Date().toISOString()}).eq('id',e.id).eq('user_id',S.me);
    if(error)throw error;
  }catch(err){console.error('Experiment analysis save failed:',err);toast('We couldn\'t save this analysis. Please try again.')}
}

const seed=()=>({users:[],me:null,theme:'rose',modal:null,
creator:{name:'Maya',niche:'Fashion & Style',audience:'College students 18–24',platform:'Instagram',stage:'Growing',followers:12480,goal:'Grow my audience'},
exps:[],
collabs:[{id:1,name:'Riya (makeup)',overlap:68,idea:'College-ready look under ₹1,000',why:'Her audience overlaps strongly with yours among college-aged viewers, and makeup complements your fashion niche.',status:null},{id:2,name:'Arjun (thrift reviews)',overlap:54,idea:'Thrift vs high street: one budget',why:'Budget-conscious viewers; your budget framing is your best-evidenced pattern.',status:null}],
opps:[{id:1,brand:'Campus-wear label (fashion)',camp:'Back-to-campus capsule',cat:'Fashion',deliv:'1 Reel + 3 Stories',pay:'₹15,000–25,000 (brand-stated)',due:'2026-11-15',match:92,reqs:['Short-form video','College audience','Affordable fashion'],stat:null},{id:2,brand:'Student budget app (finance)',camp:'Spend-smart semester',cat:'Finance',deliv:'1 Reel',pay:'₹10,000 (brand-stated)',due:'2026-11-30',match:58,reqs:['College audience','Budget content'],stat:null},{id:3,brand:'Skincare brand (beauty)',camp:'5-minute routine',cat:'Beauty',deliv:'1 Reel',pay:'Product + ₹8,000',due:'2026-12-05',match:41,reqs:['Beauty niche proof'],stat:null}],
proofs:[],ob:0,obd:{}});
let S=JSON.parse(localStorage.getItem(K)||'null')||seed();if(!S.creator)S=seed();
S.me=null;
let sKey=K;
const stateKey=id=>id?K+':'+id:K;
const save=()=>{try{localStorage.setItem(sKey,JSON.stringify(S))}catch(_){}};
function cleanCreator(name){return{name:name||'',niche:'',audience:'',platform:'',stage:'',followers:0,goal:''}}
function bindUser(user){
  const id=user&&user.id;
  if(sKey===stateKey(id)&&S.me===id)return;
  const th=S.theme;
  sKey=stateKey(id);
  let st=null;
  if(id){try{st=JSON.parse(localStorage.getItem(sKey)||'null')}catch(_){st=null}}
  S=(st&&st.creator)?st:seed();
  S.theme=th||(st&&st.theme)||'rose';
  S.me=id||null;
  S.modal=null;
  S.creator=cleanCreator(user&&user.user_metadata&&user.user_metadata.display_name);
  S.prof=false;S.onbDone=false;S.exps=[];
  S.ob=0;S.obOn=1;S.obd={};S.sp=null;S.osp=null;S.oc=0;
  chat=[];onbSkip=0;
  save();
}
function resetProfileState(user){
  S.creator=cleanCreator(user&&user.user_metadata&&user.user_metadata.display_name);
  S.prof=false;S.onbDone=false;S.exps=[];
  S.ob=0;S.obOn=1;S.obd={};S.sp=null;S.osp=null;S.oc=0;
  onbSkip=0;
  save();
}
function applyProfile(profile,user){
  S.creator={
    name:profile.display_name||(user&&user.user_metadata&&user.user_metadata.display_name)||'',
    niche:profile.niche||'',
    audience:profile.audience||'',
    platform:profile.platform||'',
    stage:profile.creator_stage||'',
    followers:profile.followers||0,
    goal:profile.primary_goal||''
  };
  S.prof=true;
  S.onbDone=profile.onboarding_completed===true;
  S.ob=S.onbDone?5:0;
  S.obOn=S.onbDone?0:1;
  S.obd={};S.sp=null;S.osp=null;S.oc=0;
  onbSkip=0;
  save();
  if(S.onbDone)clearOnbDraft(user&&user.id);
}
function exitUser(){
  const th=S.theme;
  sKey=K;
  S=seed();
  S.theme=th||'rose';
  S.me=null;
  S.modal=null;
  S.creator=cleanCreator();
  S.prof=false;S.onbDone=false;S.exps=[];S.proofs=[];
  S.ob=0;S.obOn=0;S.obd={};S.sp=null;S.osp=null;S.oc=0;
  chat=[];onbSkip=0;
  userLoad=null;
  save();
}
const draftKey=id=>id?'creator_lab_onboarding_draft_'+id:null;
function readOnbDraft(id){if(!id)return null;try{const d=JSON.parse(localStorage.getItem(draftKey(id))||'null');return d&&d.v===1?d:null}catch(_){return null}}
function saveOnbDraft(){if(!S.me||S.onbDone)return;const od=S.obd||{};if(!S.sp&&!Object.keys(od).length)return;try{localStorage.setItem(draftKey(S.me),JSON.stringify({v:1,sp:S.sp||null,osp:S.osp||null,ob:Number.isInteger(S.ob)?S.ob:0,obd:od,oc:Number.isInteger(S.oc)?S.oc:0,obOn:S.obOn?1:0,savedAt:Date.now()}))}catch(_){}}
function clearOnbDraft(id){const k=draftKey(id||S.me);if(k){try{localStorage.removeItem(k)}catch(_){}}}
function restoreOnbDraft(id){
  if(!id||S.me!==id||S.onbDone)return false;
  const d=readOnbDraft(id);if(!d)return false;
  S.sp=d.sp||null;S.osp=d.osp||null;S.ob=Number.isInteger(d.ob)?d.ob:0;
  S.obd=(d.obd&&typeof d.obd==='object')?d.obd:{};
  S.oc=Number.isInteger(d.oc)?d.oc:0;S.obOn=1;onbSkip=0;
  return true;
}
const PROTO_TOPICS={'Fashion & Style':['Outfits','Thrift & budget','Styling hacks','Seasonal trends','Hauls','Occasion looks'],Beauty:['Skincare','Everyday makeup','Routine','Product reviews','Trends','Beginner looks'],Fitness:['Home workouts','Nutrition','Beginner form','Progress logs','Recovery','Routines'],Food:['Quick recipes','Meal prep','Budget cooking','Taste tests','Techniques','Kitchen gear'],Travel:['Itineraries','Budget travel','Packing','City guides','Food spots','Travel tips'],Gaming:['Walkthroughs','Setups','Game reviews','Tips & tricks','Streams','Challenges'],Education:['Study methods','Explainers','Career advice','Tools','Tutorials','Common mistakes'],Lifestyle:['Routines','Productivity','Home & space','Habits','Day in my life','Advice'],Tech:['Reviews','Setups','Tips & tricks','Comparisons','Apps','News & trends'],Comedy:['Sketches','Relatable','Characters','Trends','Duets','Story time'],Art:['Process videos','Tutorials','Tools','Sketches','Tips','Showcase']};
const topicsFor=n=>PROTO_TOPICS[n]||['Basics','Tips','Trends','Mistakes','Routine','Showcase'];
const PROTO_FMT={Instagram:['Reel','Carousel','Story series'],TikTok:['Video','Photo post','Live clip'],YouTube:['Short','Long video','Community post'],LinkedIn:['Text post','Document post','Video'],X:['Thread','Short video','Quote post']};
const fmtFor=p=>PROTO_FMT[p]||PROTO_FMT.Instagram;
function protoContext(){const c=S.creator||{},od=S.obd||{};return{niche:c.niche||od.niche||'Lifestyle',audience:c.audience||od.audience||'Young professionals',platform:c.platform||od.platform||'Instagram',goal:c.goal||od.goal||''}}
function protoStage(){
  if(S.sp==='started')return 'started';
  if(S.sp==='estab')return 'established';
  if(S.sp==='begin')return null;
  const st=(S.creator&&S.creator.stage)||'';
  if(st==='Experimenting')return 'started';
  if(st==='Growing'||st==='Monetizing'||st==='Professional')return 'established';
  return null;
}

 if(/changed|doubled|increas|went up|2x|more views/.test(l)&&(l.includes('hook')||l.includes('view')||l.includes('after')))return"Based on what you reported, that change lines up with a possible improvement — but it is user-reported information in your question, not verified analytics in your experiment history. To confirm it, keep everything else fixed and repeat the change as one controlled test; I can't prove causation from a report alone.";
 if(/copy.*exact|exactly/.test(l))return b?"I'd run a controlled variation instead: keep the format and audience of "+b.title+", and change one variable — the opening hook only.":"Add results to at least one experiment first — then I can suggest a controlled variation to copy.";
 if(/why.*(better|perform)/.test(l)){const a=analyze(S.exps[S.exps.length-1]);return a?'What we saw: '+a.observed.join(' ')+' Likely: '+(a.likely[0]||'nothing conclusive.')+' Unknown: '+(a.unknown[0]||'missing variables such as retention, watch time and distribution'):'Add results to your latest experiment first — then I can explain what we saw and what is still unknown.'}
 if(/next|test|last three|generic|ideas/.test(l))return n?`Based on your ${done().length} experiments: "${n.title}". ${n.evidence} ${n.unk}`:'Add results to at least one experiment first, then I can suggest a useful next test.';

function report(){const s=stats(),d=done(),c=S.creator,L=learnings();const t=d.reduce((a,e)=>({v:a.v+e.views,s:a.s+e.saves,sh:a.sh+e.shares,g:a.g+e.gained}),{v:0,s:0,sh:0,g:0});S.modal=`<div class="modal"><div class="paper"><h2>Creator Report: ${c.name}</h2><p class="mut">${c.niche} · ${c.platform} · ${c.audience} · Goal: ${c.goal}</p><p><b>${d.length}</b> experiments · <b>${f(t.v)}</b> views · <b>${t.s}</b> saves · <b>${t.sh}</b> shares · <b>+${t.g}</b> followers</p><h3>Top content</h3><p>${s.best.title}: ${f(s.best.views)} views, ${s.best.saves} saves.</p><h3>What worked</h3><ul>${L.know.map(x=>`<li>${x}</li>`).join('')}</ul><h3>What underperformed</h3><p>${[...d].sort((a,b)=>a.saves/a.views-b.saves/b.views)[0].title} had the lowest save rate. That makes it a baseline, not a failure — hook and topic are still untested.</p><h3>Unknowns</h3><ul>${L.unk.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Recommended next</h3><p>${nextExp().title} — ${nextExp().variable}.</p><h3>Monetization readiness</h3><p>Evidence: ${s.best?`${s.best.topic}, ${s.best.format}`:'no measured results yet'}. Missing: a measured campaign and collaboration results. No income is implied.</p><button class="btn" data-a="dl">Download report</button> <button class="btn alt" data-a="close">Close</button></div></div>`;toast('Your Creator Report is ready.');render()}
let authBusy=false;
async function authFlow(a){if(authBusy)return;authBusy=true;const E=t=>{const el=$('#err');if(el)el.textContent=t};
try{
const e=$('#e').value.trim().toLowerCase(),p=$('#p').value;
if(!/\S+@\S+\.\S+/.test(e)||p.length<6){E('Enter a valid email and a password of at least 6 characters.');return}
let n='';if(a=='signup'){n=$('#n').value.trim();if(!n){E('Add your name.');return}}
if(!supa){E('Sign-in is unavailable right now. Please try again later.');return}
if(a=='signup'){
const {data,error}=await supa.auth.signUp({email:e,password:p,options:{data:{display_name:n}}});
if(error){E(error.code==='user_already_exists'||/already/i.test(error.message||'')?'That email already has an account. Log in instead.':error.message||'We could not create your account.');return}
if(!data.session){S.modal=null;render();toast('Account created. Confirm your email, then log in.');return}
await ensureUser(data.user);
if(n)S.creator.name=n;
save();
}else{
const {data,error}=await supa.auth.signInWithPassword({email:e,password:p});
if(error){E(/invalid login credentials/i.test(error.message||'')?'Email or password is incorrect.':error.message||'We could not log you in.');return}
await ensureUser(data.user);
}
S.modal=null;go('home');render();
}catch(err){console.error('Authentication failed:',err);E('Something went wrong. Please try again.')}
finally{authBusy=false}}
async function saveProfile(){return upsertProfile(profileSnapshot())}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id,D=b.dataset,v=s=>$(s)?.value;
if(a=='auth'){S.modal=V.auth(D.m);render()}
else if(a=='close'){S.modal=null;render()}
else if(a=='signup'||a=='login'){authFlow(a)}
else if(a=='ob'){S.obd[D.k]=D.v;render()}
else if(a=='obn'){const k=OB[S.ob][1];if(k=='audience'&&$('#cu')?.value)S.obd.audience=$('#cu').value;if($('#oth')){const t=($('#oth').value||'').trim();if(!t){toast('Type your own answer to continue.');return}S.obd[k]=t}Object.assign(S.creator,S.obd);ensurePrototypeData();S.ob++;if(S.ob>4){S.ob=5;S.obOn=0;const userId=S.me;saveProfile().then(ok=>{if(ok&&S.me===userId){S.onbDone=true;clearOnbDraft(userId);save();render()}});toast('Your first experiment starts here.')}render()}
else if(a=='out'){exitUser();go('home');render();if(supa)supa.auth.signOut().catch(e=>console.error('Sign out failed:',e))}
else if(a=='theme'){S.theme=D.v;render()}
 else if(a=='runnext'||a=='gen'){if(!nextExp()){toast('Add results to an experiment first.');return}nextGen(null)}
 else if(a=='iintent'){ideaIntent=D.v;render()}
 else if(a=='igen'){genIdeas()}
 else if(a=='iclear'){ideas=[];ideaDrop=0;ideaNote='';ideaSrc=null;render()}
 else if(a=='ideaexp'){const i=+D.i,it=ideas[i];if(!it)return;ideas.splice(i,1);newexp({title:it.title,topic:S.creator.niche||'',sub:'',aud:S.creator.audience||'',format:it.format||'Reel',hook:it.hook||'',hyp:it.whyFit||'',variable:it.tests||''});toast('Idea moved into your experiment form.')}
else if(a=='acceptnext'){const n=window._n||nextExp();S.exps.push({id:Date.now(),title:n.title,topic:n.title.includes(':')?n.title.split(':')[0]:(S.creator.niche||''),sub:'',aud:n.aud,format:n.format,hook:n.hook,hyp:n.hyp,variable:n.variable,goal:n.goal,views:0,likes:0,comments:0,saves:0,shares:0,gained:0,date:new Date().toISOString().slice(0,10),status:'Idea',an:null});S.modal=null;go('exp');render();toast('Experiment saved. Your next learning loop starts here.')}
else if(a=='newexp')newexp();
else if(a=='firststart'||a=='firstretry')startFirst();
else if(a=='firsttmpl'){firstExp=templateFirst();firstSrc='template';firstBusy=false;firstErr=false;render()}
else if(a=='firstcreate')createFirst();
else if(a=='savexp'){const e={id:Date.now(),views:0,likes:0,comments:0,saves:0,shares:0,gained:0,date:new Date().toISOString().slice(0,10),status:'Idea',an:null,goal:S.creator.goal};['title','topic','sub','aud','format','hook','hyp','variable'].forEach(k=>e[k]=v('#x_'+k).trim());if(!e.title){toast('Add a title first.');return}S.exps.push(e);S.modal=null;render();saveNewExperiment(e)}
else if(a=='results')results(id);
else if(a=='saveres'){const e=S.exps.find(z=>z.id==id);['views','likes','comments','saves','shares','gained'].forEach(k=>e[k]=+v('#r_'+k)||0);e.status=e.views?'Learned':e.status;e.an=null;S.modal=null;render();saveExperimentResults(e)}
else if(a=='adv'){const e=S.exps.find(z=>z.id==id);e.status=ST[Math.min(ST.indexOf(e.status)+1,3)];render()}
else if(a=='analyze'){const e=S.exps.find(z=>z.id==id);withAI('analyze-performance',{current:e},null,d=>{e.an={observed:[].concat(d.observed),likely:[].concat(d.likely),unknown:[].concat(d.unknown),next:d.nextTest,conf:d.confidence,real:1};saveExperimentAnalysis(e)},()=>{e.an=analyze(e)})}
else if(a=='propose'){const c=S.collabs.find(z=>z.id==id);c.status='Proposed';render();toast('Collaboration request sent.')}
else if(a=='cadv'){const c=S.collabs.find(z=>z.id==id),L=['Proposed','Accepted','Planning','Creating','Published','Measuring','Learned'];c.status=L[Math.min(L.indexOf(c.status)+1,6)];render()}
else if(a=='cdec'){S.collabs.find(z=>z.id==id).status=null;render();toast('Declined. You can propose again or pick another creator.')}
else if(a=='proofnew'){S.modal=`<div class="modal"><div><h3>Create proof</h3><label>Which experiment?</label><select id="pe">${done().map(e=>`<option value="${e.id}">${e.title}</option>`).join('')}</select><button class="btn" data-a="proofsave">Create proof</button> <button class="btn alt" data-a="close">Cancel</button></div></div>`;render()}
else if(a=='proofsave'){const e=S.exps.find(z=>z.id==v('#pe'));S.proofs.push({eid:e.id,learn:e.an?e.an.unknown[0]:`Measured results show ${e.saves} saves and +${e.gained} followers; the cause of this result isn't isolated yet.`});S.modal=null;render();toast('Your proof is ready to share.')}
else if(a=='report')progress(['Gathering your experiments','Analyzing performance','Finding your strongest patterns','Reviewing collaboration evidence','Preparing monetization insights','Building your Creator Report'],report);
else if(a=='dl'){const t='<!doctype html><meta charset=utf-8><title>Creator Report</title><style>body{font:16px/1.6 Georgia,serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#2B2522;background:#FBF3E6}h2,h3{color:#B8325A;font-weight:400}button{display:none}@media print{body{background:#fff}}</style>'+$('.modal .paper').innerHTML,u=URL.createObjectURL(new Blob([t],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download='creator-report.html';l.click();toast('Open the file and print to save as PDF.')}
else if(a=='share'){go('creator/proof')}else if(a=='share_old'){const c=S.creator,s=stats();S.modal=`<div class="modal"><div class="paper"><h2>${c.name} · Public proof</h2><p>${c.niche} · ${c.platform} · ${c.audience}</p><p>Strongest: ${s.best.title}: ${f(s.best.views)} views, ${s.best.saves} saves, +${s.best.gained} followers.</p><p class="mut">Private data (email, drafts) is not included.</p><button class="btn" data-a="copy">Copy proof text</button> <button class="btn alt" data-a="close">Close</button></div></div>`;render()}
else if(a=='copy'){navigator.clipboard?.writeText($('.modal .paper').innerText).catch(()=>{});toast('Copied.')}
else if(a=='pitch'){const o=S.opps.find(z=>z.id==id),show=t=>{S.modal=`<div class="modal" role="dialog"><div><h3>Your pitch is ready.</h3><label for="pt">Pitch</label><textarea id="pt" rows="14">${t}</textarea><button class="btn" data-a="copyp">Copy</button> <button class="btn alt" data-a="close">Close</button></div></div>`};withAI('generate-pitch',{opportunity:o},null,d=>show([d.opening,d.creatorFit,d.evidence,d.contribution,d.closing].join('\n\n')),()=>show(pitch(o)))}
else if(a=='copyp'){navigator.clipboard?.writeText($('.modal textarea').value).catch(()=>{});toast('Copied.')}
else if(a=='apply'){S.opps.find(z=>z.id==id).stat='Applied';render();toast('Application sent. Track it here.')}
else if(a=='oadv'){const o=S.opps.find(z=>z.id==id),L=['Applied','Negotiating','Accepted','Creating','Submitted','Published','Measured','Completed'];const nx=L[Math.min(L.indexOf(o.stat)+1,7)];if(nx=='Completed'){resModal('camp',id);return}o.stat=nx;render()}
else if(a=='ask'||a=='askin'){const q=a=='ask'?D.q:v('#q');if(!q?.trim())return;chat.push({r:'u',t:q});withAI('coach',{},q,d=>chat.push({r:'c',t:d.answer}),()=>chat.push({r:'c',t:coach(q)}))}});
addEventListener('hashchange',render);render();initSupabase();
</script></body></html>
